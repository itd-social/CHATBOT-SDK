[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "itd-chatbot-sdk"
version = "1.4.0"
description = "Unofficial Python SDK for the ITD messenger"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.25,<1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/itd-social/CHATBOT-SDK"
Repository = "https://github.com/itd-social/CHATBOT-SDK"
Issues = "https://github.com/itd-social/CHATBOT-SDK/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
websocket = ["websocket-client>=1.8,<2"]
images = ["Pillow>=10,<13"]
env = ["python-dotenv>=1,<2"]
dev = ["pytest>=7", "ruff==0.17.5", "mypy==2.4.1", "pre-commit>=3.7,<5", "build>=1,<2", "websocket-client>=1.8,<2", "Pillow>=10,<13"]
release = ["python-semantic-release==10.7.0", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["itd_bot*"]

[tool.setuptools.package-data]
itd_bot = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["itd_bot"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
addopts = "-m 'not perf'"
markers = ["perf: offline performance measurements and concurrency comparisons"]

[[tool.mypy.overrides]]
module = ["websocket", "websocket.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["itd_bot"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): v{version}"
allow_zero_version = true
major_on_zero = false
build_command = "python -m build"

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat", "feature"]
patch_tags = ["fix", "perf", "refactor", "revert"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "test"]
allowed_tags = ["feat", "feature", "fix", "perf", "refactor", "revert", "build", "chore", "ci", "docs", "style", "test"]

[tool.semantic_release.changelog]
mode = "update"
template_dir = "templates"
