name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release and push its commit and tag
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,release]"
      - run: python -m ruff check itd_bot examples tests
      - run: python -m ruff format --check itd_bot examples tests
      - run: python -m pytest -q
      - name: Check working tree
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git tag --list | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            semantic-release --noop version
          else
            semantic-release --noop version --major
          fi
      - name: Create release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          if git tag --list | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            semantic-release version
          else
            semantic-release version --major
          fi
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            semantic-release publish
          else
            echo "No new version; skipping artifact upload."
          fi
