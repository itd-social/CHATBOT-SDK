name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb")); assert "v"+p["project"]["version"] == os.environ["RELEASE_TAG"], "Tag and project version differ"'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check itd_bot examples tests
      - run: python -m ruff format --check itd_bot examples tests
      - run: python -m pytest -q
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
